name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build, package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ github.event.head_commit.message || 'Manual release' }}
        run: |
          set -euo pipefail
          meta=src/Jellyfin.Plugin.QBittorrent/build.yaml

          # Jellyfin only updates to a strictly higher version, so every release
          # takes major.minor.patch from build.yaml plus the run number as the 4th part.
          base=$(yq -r '.version' "$meta" | cut -d. -f1-3)
          version="$base.$GITHUB_RUN_NUMBER"
          tag="v$version"

          dotnet publish src/Jellyfin.Plugin.QBittorrent -c Release -o publish \
            -p:Version="$version" -p:AssemblyVersion="$version" -p:FileVersion="$version"
          zip -j qbittorrent-manager.zip publish/Jellyfin.Plugin.QBittorrent.dll

          gh release create "$tag" qbittorrent-manager.zip \
            --target "$GITHUB_SHA" --title "$tag" --notes "${CHANGELOG%%$'\n'*}" --latest

          # The plugin repository manifest lives on the `manifest` branch at a fixed URL,
          # keeping every released version so Jellyfin always sees the newest one.
          if git fetch -q --depth=1 origin manifest 2>/dev/null; then
            parent=(-p FETCH_HEAD)
            git show FETCH_HEAD:manifest.json > previous.json
          else
            parent=()
            echo '[{"versions": []}]' > previous.json
          fi

          yq -o=json "$meta" | jq \
            --slurpfile previous previous.json \
            --arg version "$version" \
            --arg changelog "${CHANGELOG%%$'\n'*}" \
            --arg sourceUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/qbittorrent-manager.zip" \
            --arg checksum "$(md5sum qbittorrent-manager.zip | cut -d' ' -f1)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{guid, name, description, overview, owner, category,
               versions: ([{version: $version, changelog: $changelog, targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp}]
                 + ($previous[0][0].versions | map(select(.version != $version))))}]' \
            > manifest.json

          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          tree=$(printf '100644 blob %s\tmanifest.json\n' "$(git hash-object -w manifest.json)" | git mktree)
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "Release $version")
          git push -q origin "$commit:refs/heads/manifest"
