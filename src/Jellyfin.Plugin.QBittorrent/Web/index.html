<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>qBittorrent</title>
</head>
<body>
    <div id="QBittorrentPage" data-role="page" class="page type-interior">
        <style>
            #QBittorrentPage {
                --qbt-accent: #00a4dc;
                --qbt-green: #3ec27b;
                --qbt-amber: #e0a23c;
                --qbt-red: #f05252;
                --qbt-muted: color-mix(in srgb, currentColor 55%, transparent);
                --qbt-border: color-mix(in srgb, currentColor 11%, transparent);
                --qbt-subtle: color-mix(in srgb, currentColor 4%, transparent);
                --qbt-hover: color-mix(in srgb, currentColor 7%, transparent);
                --qbt-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
            }
            #QBittorrentPage .qbt { max-width: 1040px; margin: 0 auto; padding: 1.5rem 0 4rem; font-size: 14px; line-height: 1.45; }
            #QBittorrentPage .qbt *, #QBittorrentPage .qbt *::before { box-sizing: border-box; }
            #QBittorrentPage .qbt .num { font-family: var(--qbt-mono); font-variant-numeric: tabular-nums; }
            #QBittorrentPage .qbt .muted { color: var(--qbt-muted); }

            /* header */
            #QBittorrentPage .qbt-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
            #QBittorrentPage .qbt-header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.015em; margin: 0; margin-right: auto; }

            /* buttons */
            #QBittorrentPage .qbt-btn {
                display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
                height: 2.25rem; padding: 0 0.9rem; border-radius: 8px; border: 1px solid var(--qbt-border);
                background: transparent; color: inherit; font: inherit; font-weight: 500; cursor: pointer;
                text-decoration: none; white-space: nowrap; transition: background-color .15s, border-color .15s;
            }
            #QBittorrentPage .qbt-btn:hover { background: var(--qbt-hover); }
            #QBittorrentPage .qbt-btn:focus-visible, #QBittorrentPage .qbt :focus-visible { outline: 2px solid var(--qbt-accent); outline-offset: 2px; }
            #QBittorrentPage .qbt-btn-primary { background: var(--qbt-accent); border-color: var(--qbt-accent); color: #fff; }
            #QBittorrentPage .qbt-btn-primary:hover { background: color-mix(in srgb, var(--qbt-accent) 85%, #fff); }
            #QBittorrentPage .qbt-btn-sm { height: 1.9rem; padding: 0 0.7rem; font-size: 13px; }
            #QBittorrentPage .qbt-btn-danger { color: var(--qbt-red); }
            #QBittorrentPage .qbt-icon-btn { width: 2rem; height: 2rem; padding: 0; border-color: transparent; color: var(--qbt-muted); }
            #QBittorrentPage .qbt-icon-btn:hover { color: inherit; }
            #QBittorrentPage .qbt svg { width: 16px; height: 16px; flex-shrink: 0; }

            /* stats */
            #QBittorrentPage .qbt-stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--qbt-border); border-radius: 12px; margin-bottom: 1.75rem; }
            #QBittorrentPage .qbt-stat { padding: 1rem 1.25rem; }
            #QBittorrentPage .qbt-stat + .qbt-stat { border-left: 1px solid var(--qbt-border); }
            #QBittorrentPage .qbt-stat-label { font-size: 12px; color: var(--qbt-muted); margin-bottom: 0.3rem; }
            #QBittorrentPage .qbt-stat-value { font-size: 1.35rem; font-weight: 500; letter-spacing: -0.01em; }
            #QBittorrentPage .qbt-stat-sub { font-size: 11px; color: var(--qbt-muted); margin-top: 0.15rem; }
            #QBittorrentPage .qbt-btn.is-active { border-color: var(--qbt-amber); color: var(--qbt-amber); }
            #QBittorrentPage .qbt-tag { display: inline-block; padding: 0 0.4rem; border-radius: 4px; background: var(--qbt-hover); font-size: 11px; line-height: 1.5; }
            #QBittorrentPage .qbt-tags-edit { display: flex; gap: 0.5rem; align-items: center; padding: 0.6rem 0 0.1rem; font-size: 13px; }
            #QBittorrentPage .qbt-tags-edit .qbt-input { height: 1.9rem; max-width: 360px; }
            #QBittorrentPage .qbt-table select.qbt-input { height: 1.6rem; width: auto; padding: 0 0.3rem; font-size: 12px; appearance: auto; }
            #QBittorrentPage .qbt-hint { font-size: 12px; color: var(--qbt-muted); margin: -0.4rem 0 1rem; }

            /* toolbar */
            #QBittorrentPage .qbt-toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
            #QBittorrentPage .qbt-segments { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--qbt-subtle); border: 1px solid var(--qbt-border); overflow-x: auto; max-width: 100%; }
            #QBittorrentPage .qbt-segment {
                display: inline-flex; align-items: center; gap: 0.4rem; height: 1.85rem; padding: 0 0.7rem;
                border: 0; border-radius: 6px; background: transparent; color: var(--qbt-muted); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
            }
            #QBittorrentPage .qbt-segment:hover { color: inherit; }
            #QBittorrentPage .qbt-segment[aria-pressed="true"] { background: var(--qbt-hover); color: inherit; font-weight: 500; }
            #QBittorrentPage .qbt-segment .num { font-size: 11px; color: var(--qbt-muted); }
            #QBittorrentPage .qbt-search { position: relative; flex: 0 1 260px; min-width: 180px; }
            #QBittorrentPage .qbt-search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--qbt-muted); pointer-events: none; }
            #QBittorrentPage .qbt-input {
                width: 100%; height: 2.25rem; padding: 0 0.75rem; border-radius: 8px; border: 1px solid var(--qbt-border);
                background: var(--qbt-subtle); color: inherit; font: inherit; transition: border-color .15s;
            }
            #QBittorrentPage .qbt-input::placeholder { color: var(--qbt-muted); }
            #QBittorrentPage .qbt-input:focus { outline: none; border-color: var(--qbt-accent); }
            #QBittorrentPage .qbt-search .qbt-input { padding-left: 2.1rem; }

            /* list */
            #QBittorrentPage .qbt-list { border: 1px solid var(--qbt-border); border-radius: 12px; overflow: hidden; }
            #QBittorrentPage .qbt-list-head, #QBittorrentPage .qbt-row-head {
                display: grid; grid-template-columns: minmax(0, 1fr) 150px 150px 64px 2rem; gap: 1.25rem; align-items: center; padding: 0 1rem;
            }
            #QBittorrentPage .qbt-list-head { height: 2.25rem; font-size: 12px; color: var(--qbt-muted); background: var(--qbt-subtle); border-bottom: 1px solid var(--qbt-border); }
            #QBittorrentPage .qbt-row + .qbt-row { border-top: 1px solid var(--qbt-border); }
            #QBittorrentPage .qbt-row-head { min-height: 3.75rem; padding-top: 0.6rem; padding-bottom: 0.6rem; cursor: pointer; transition: background-color .12s; }
            #QBittorrentPage .qbt-row-head:hover, #QBittorrentPage .qbt-row.is-open .qbt-row-head { background: var(--qbt-subtle); }
            #QBittorrentPage .qbt-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #QBittorrentPage .qbt-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.15rem; font-size: 12px; color: var(--qbt-muted); white-space: nowrap; overflow: hidden; }
            #QBittorrentPage .qbt-status { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--qbt-status); }
            #QBittorrentPage .qbt-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
            #QBittorrentPage .qbt-progress { display: flex; align-items: center; gap: 0.6rem; font-size: 12px; }
            #QBittorrentPage .qbt-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--qbt-border); overflow: hidden; }
            #QBittorrentPage .qbt-bar > span { display: block; height: 100%; background: var(--qbt-status); border-radius: inherit; transition: width .4s ease; }
            #QBittorrentPage .qbt-speeds { display: flex; flex-direction: column; font-size: 12px; }
            #QBittorrentPage .qbt-eta { font-size: 12px; text-align: right; }
            #QBittorrentPage .qbt-empty { padding: 4rem 1rem; text-align: center; color: var(--qbt-muted); }
            #QBittorrentPage .qbt-empty strong { display: block; color: inherit; font-weight: 500; margin-bottom: 0.25rem; }

            /* detail */
            #QBittorrentPage .qbt-detail { padding: 0.25rem 1rem 1rem; background: var(--qbt-subtle); }
            #QBittorrentPage .qbt-detail-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--qbt-border); margin-bottom: 0.5rem; }
            #QBittorrentPage .qbt-tabs { display: flex; gap: 1.25rem; }
            #QBittorrentPage .qbt-tab { padding: 0.65rem 0; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--qbt-muted); font: inherit; font-size: 13px; cursor: pointer; }
            #QBittorrentPage .qbt-tab:hover { color: inherit; }
            #QBittorrentPage .qbt-tab[aria-selected="true"] { color: inherit; font-weight: 500; border-bottom-color: currentColor; }
            #QBittorrentPage .qbt-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.4rem 0; }
            #QBittorrentPage .qbt-actions .qbt-sep { width: 1px; background: var(--qbt-border); margin: 0.2rem 0.2rem; }
            #QBittorrentPage .qbt-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
            #QBittorrentPage .qbt-table th { text-align: left; font-weight: 500; color: var(--qbt-muted); padding: 0.5rem 0.75rem 0.5rem 0; }
            #QBittorrentPage .qbt-table td { padding: 0.45rem 0.75rem 0.45rem 0; border-top: 1px solid var(--qbt-border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #QBittorrentPage .qbt-table .r { text-align: right; }
            #QBittorrentPage .qbt-detail-msg { padding: 1.25rem 0; font-size: 13px; color: var(--qbt-muted); }

            /* dialog */
            #QBittorrentPage .qbt-dialog {
                width: min(440px, calc(100vw - 2rem)); padding: 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
                background: #1c1c1e; color: #ececec; box-shadow: 0 24px 60px rgba(0,0,0,0.45);
            }
            #QBittorrentPage .qbt-dialog::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); }
            #QBittorrentPage .qbt-dialog form { padding: 1.5rem; }
            #QBittorrentPage .qbt-dialog h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.25rem; }
            #QBittorrentPage .qbt-field { margin-bottom: 1rem; }
            #QBittorrentPage .qbt-field > label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 0.4rem; }
            #QBittorrentPage .qbt-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            #QBittorrentPage .qbt-dialog select.qbt-input { appearance: auto; }
            #QBittorrentPage .qbt-dialog select.qbt-input option { background: #1c1c1e; }
            #QBittorrentPage .qbt-file { display: flex; align-items: center; gap: 0.6rem; font-size: 13px; }
            #QBittorrentPage .qbt-file input { display: none; }
            #QBittorrentPage .qbt-divider { display: flex; align-items: center; gap: 0.75rem; margin: 0.25rem 0 0.9rem; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--qbt-muted); }
            #QBittorrentPage .qbt-divider::before, #QBittorrentPage .qbt-divider::after { content: ""; flex: 1; height: 1px; background: var(--qbt-border); }
            #QBittorrentPage .qbt-check { display: flex; align-items: center; gap: 0.5rem; font-size: 13px; cursor: pointer; }
            #QBittorrentPage .qbt-check input { accent-color: var(--qbt-accent); width: 16px; height: 16px; margin: 0; }
            #QBittorrentPage .qbt-error { min-height: 1.2em; margin: 0.9rem 0 0; font-size: 13px; color: var(--qbt-red); }
            #QBittorrentPage .qbt-dialog-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

            /* views + web search */
            #QBittorrentPage .qbt-views { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--qbt-border); margin-bottom: 1.25rem; }
            #QBittorrentPage .qbt-views .qbt-tab { font-size: 14px; }
            #QBittorrentPage .qbt-websearch { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
            #QBittorrentPage .qbt-websearch .qbt-search { flex: 1 1 auto; max-width: none; }
            #QBittorrentPage .qbt-search-status { min-height: 1.4em; margin-bottom: 0.75rem; font-size: 13px; }
            #QBittorrentPage .qbt-result-grid { display: grid; grid-template-columns: minmax(0, 1fr) 90px 64px 64px auto; gap: 1.25rem; align-items: center; padding: 0 1rem; }
            #QBittorrentPage .qbt-result { min-height: 3.5rem; padding-top: 0.55rem; padding-bottom: 0.55rem; }
            #QBittorrentPage .qbt-result + .qbt-result { border-top: 1px solid var(--qbt-border); }
            #QBittorrentPage .qbt-result:hover { background: var(--qbt-subtle); }
            #QBittorrentPage .qbt-result .r, #QBittorrentPage .qbt-result-grid .r { text-align: right; font-size: 12px; }
            #QBittorrentPage .qbt-result a { color: inherit; }
            #QBittorrentPage .qbt-seeds { color: var(--qbt-green); }
            #QBittorrentPage .show-sm { display: none; }

            /* toast */
            #QBittorrentPage .qbt-toast {
                position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
                padding: 0.6rem 1rem; border-radius: 10px; background: #1c1c1e; color: #ececec; border: 1px solid rgba(255,255,255,0.1);
                font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); transition: opacity .2s, transform .2s; z-index: 1000;
            }
            #QBittorrentPage .qbt-toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

            @media (max-width: 720px) {
                #QBittorrentPage .qbt { padding-top: 1rem; }
                #QBittorrentPage .qbt-stats { grid-template-columns: repeat(2, 1fr); }
                #QBittorrentPage .qbt-stat:nth-child(3) { border-left: 0; }
                #QBittorrentPage .qbt-stat:nth-child(n+3) { border-top: 1px solid var(--qbt-border); }
                #QBittorrentPage .qbt-list-head { display: none; }
                #QBittorrentPage .qbt-row-head { grid-template-columns: minmax(0, 1fr) auto 2rem; gap: 0.4rem 0.75rem; }
                #QBittorrentPage .qbt-row-head > :nth-child(1) { grid-column: 1 / 3; }
                #QBittorrentPage .qbt-row-head > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
                #QBittorrentPage .qbt-row-head > :nth-child(3) { grid-row: 3; flex-direction: row; gap: 0.75rem; }
                #QBittorrentPage .qbt-row-head > :nth-child(4) { grid-row: 3; grid-column: 2 / -1; }
                #QBittorrentPage .qbt-row-head > :nth-child(5) { grid-column: 3; grid-row: 1; }
                #QBittorrentPage .qbt-search { flex: 1 1 100%; }
                #QBittorrentPage .qbt-table .hide-sm { display: none; }
                #QBittorrentPage .qbt-result-grid { grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; }
                #QBittorrentPage .qbt-result-grid > .hide-sm { display: none; }
                #QBittorrentPage .show-sm { display: inline; }
            }
        </style>

        <div data-role="content">
            <div class="content-primary qbt">
                <header class="qbt-header">
                    <h1>qBittorrent</h1>
                    <a class="qbt-btn" href="#/configurationpage?name=qBittorrent%20Manager" title="Settings" aria-label="Settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        <span>Settings</span>
                    </a>
                    <button id="QbtLimitsButton" type="button" class="qbt-btn" title="Speed limits">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
                        <span>Limits</span>
                    </button>
                    <button id="QbtAddButton" type="button" class="qbt-btn qbt-btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        <span>Add torrent</span>
                    </button>
                </header>

                <section class="qbt-stats" aria-label="Transfer summary">
                    <div class="qbt-stat"><div class="qbt-stat-label">Download</div><div id="QbtDlValue" class="qbt-stat-value num">—</div><div id="QbtDlLimit" class="qbt-stat-sub num"></div></div>
                    <div class="qbt-stat"><div class="qbt-stat-label">Upload</div><div id="QbtUpValue" class="qbt-stat-value num">—</div><div id="QbtUpLimit" class="qbt-stat-sub num"></div></div>
                    <div class="qbt-stat"><div class="qbt-stat-label">Downloading</div><div id="QbtDownloadingCount" class="qbt-stat-value num">—</div></div>
                    <div class="qbt-stat"><div class="qbt-stat-label">Seeding</div><div id="QbtSeedingCount" class="qbt-stat-value num">—</div></div>
                </section>

                <nav class="qbt-views" role="tablist" aria-label="View">
                    <button type="button" class="qbt-tab" role="tab" data-view="torrents" aria-selected="true">Torrents</button>
                    <button type="button" class="qbt-tab" role="tab" data-view="search" aria-selected="false">Search</button>
                </nav>

                <div id="QbtTorrentsView">
                <div class="qbt-toolbar">
                    <div id="QbtTabs" class="qbt-segments" role="group" aria-label="Filter by state"></div>
                    <label class="qbt-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input id="QbtSearch" class="qbt-input" type="search" placeholder="Search torrents" aria-label="Search torrents" />
                    </label>
                </div>

                <div class="qbt-list">
                    <div class="qbt-list-head" aria-hidden="true"><span>Name</span><span>Progress</span><span>Speed</span><span style="text-align:right">ETA</span><span></span></div>
                    <div id="QbtList"><div class="qbt-empty">Loading…</div></div>
                </div>
                </div>

                <div id="QbtSearchView" hidden>
                    <form id="QbtWebSearchForm" class="qbt-websearch">
                        <label class="qbt-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                            <input id="QbtWebSearchInput" class="qbt-input" type="search" placeholder="Search torrent sites" aria-label="Search torrent sites" maxlength="200" required />
                        </label>
                        <button type="submit" class="qbt-btn qbt-btn-primary">Search</button>
                    </form>
                    <div id="QbtWebSearchStatus" class="qbt-search-status muted" aria-live="polite"></div>
                    <div class="qbt-list">
                        <div class="qbt-list-head qbt-result-grid" aria-hidden="true"><span>Name</span><span class="r hide-sm">Size</span><span class="r hide-sm">Seeds</span><span class="r hide-sm">Leechers</span><span></span></div>
                        <div id="QbtWebResults"><div class="qbt-empty">Results come from the search plugins installed in qBittorrent.</div></div>
                    </div>
                </div>

                <div id="QbtToast" class="qbt-toast" role="status" aria-live="polite"></div>

                <dialog id="QbtLimitsDialog" class="qbt-dialog" aria-labelledby="QbtLimitsTitle">
                    <form id="QbtLimitsForm" method="dialog">
                        <h2 id="QbtLimitsTitle">Speed limits</h2>
                        <div class="qbt-row2">
                            <div class="qbt-field">
                                <label for="QbtLimitDown">Download (KiB/s)</label>
                                <input id="QbtLimitDown" class="qbt-input" type="number" min="0" step="1" placeholder="0 = unlimited" />
                            </div>
                            <div class="qbt-field">
                                <label for="QbtLimitUp">Upload (KiB/s)</label>
                                <input id="QbtLimitUp" class="qbt-input" type="number" min="0" step="1" placeholder="0 = unlimited" />
                            </div>
                        </div>
                        <p id="QbtLimitsHint" class="qbt-hint">0 means unlimited.</p>
                        <label class="qbt-check"><input id="QbtAltLimits" type="checkbox" /> Use alternative speed limits</label>
                        <div id="QbtLimitsError" class="qbt-error" role="alert"></div>
                        <div class="qbt-dialog-footer">
                            <button type="button" id="QbtLimitsCancel" class="qbt-btn">Cancel</button>
                            <button type="submit" class="qbt-btn qbt-btn-primary">Save</button>
                        </div>
                    </form>
                </dialog>

                <dialog id="QbtAddDialog" class="qbt-dialog" aria-labelledby="QbtAddTitle">
                    <form id="QbtAddForm" method="dialog">
                        <h2 id="QbtAddTitle">Add torrent</h2>

                        <div class="qbt-field">
                            <label for="QbtAddMagnet">Magnet link or URL</label>
                            <input id="QbtAddMagnet" class="qbt-input" type="text" placeholder="magnet:?xt=urn:btih:…" autocomplete="off" />
                        </div>

                        <div class="qbt-divider">or</div>

                        <div class="qbt-field qbt-file">
                            <label class="qbt-btn qbt-btn-sm" for="QbtAddFile">Choose .torrent file</label>
                            <input id="QbtAddFile" type="file" accept=".torrent" />
                            <span id="QbtAddFileName" class="muted">No file selected</span>
                        </div>

                        <div class="qbt-field">
                            <label for="QbtAddProfile">Profile</label>
                            <select id="QbtAddProfile" class="qbt-input">
                                <option value="">None — set manually</option>
                            </select>
                        </div>

                        <div class="qbt-row2">
                            <div class="qbt-field">
                                <label for="QbtAddCategory">Category</label>
                                <input id="QbtAddCategory" class="qbt-input" type="text" placeholder="Optional" />
                            </div>
                            <div class="qbt-field">
                                <label for="QbtAddSavePath">Save path</label>
                                <input id="QbtAddSavePath" class="qbt-input" type="text" placeholder="Default" />
                            </div>
                        </div>

                        <label class="qbt-check"><input id="QbtAddStart" type="checkbox" checked /> Start immediately</label>

                        <div id="QbtAddError" class="qbt-error" role="alert"></div>

                        <div class="qbt-dialog-footer">
                            <button type="button" id="QbtAddCancel" class="qbt-btn">Cancel</button>
                            <button type="submit" id="QbtAddSubmit" class="qbt-btn qbt-btn-primary">Add torrent</button>
                        </div>
                    </form>
                </dialog>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var REFRESH_MS = 3000;
                var page = document.querySelector('#QBittorrentPage');

                var TABS = [
                    ['', 'All'], ['Downloading', 'Downloading'], ['Seeding', 'Seeding'],
                    ['Paused', 'Paused'], ['Completed', 'Completed'], ['Error', 'Errored']
                ];

                // States where the row's quick action pauses; everything else offers resume.
                var ACTIVE_STATES = ['Downloading', 'Seeding', 'Checking', 'Queued'];

                var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
                var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

                var state = { search: '', filterState: '', torrents: [], pollHandle: null, openHash: null, openTab: 'files', detailCache: {} };

                function stateColor(s) {
                    switch (s) {
                        case 'Downloading': return 'var(--qbt-accent)';
                        case 'Seeding': return 'var(--qbt-green)';
                        case 'Completed': return 'var(--qbt-green)';
                        case 'Checking': return 'var(--qbt-amber)';
                        case 'Error': return 'var(--qbt-red)';
                        default: return 'var(--qbt-muted)';
                    }
                }

                function formatBytes(n) {
                    if (!n || n <= 0) { return '0 B'; }
                    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
                    var i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
                    return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
                }

                function formatSpeed(n) { return formatBytes(n) + '/s'; }

                function formatEta(seconds) {
                    if (!seconds || seconds <= 0 || seconds >= 8640000) { return '∞'; }
                    var d = Math.floor(seconds / 86400);
                    var h = Math.floor((seconds % 86400) / 3600);
                    var m = Math.floor((seconds % 3600) / 60);
                    if (d > 0) { return d + 'd ' + h + 'h'; }
                    if (h > 0) { return h + 'h ' + m + 'm'; }
                    return m + 'm';
                }

                function escapeHtml(s) {
                    var div = document.createElement('div');
                    div.textContent = s == null ? '' : String(s);
                    return div.innerHTML.replace(/"/g, '&quot;');
                }

                function ajax(path) {
                    return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('api/' + path), dataType: 'json' });
                }

                function apiPost(path) { return ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('api/' + path) }); }
                function apiDelete(path) { return ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl('api/' + path) }); }
                function apiJson(type, path, body) {
                    return ApiClient.ajax({ type: type, url: ApiClient.getUrl('api/' + path), data: JSON.stringify(body), contentType: 'application/json' });
                }

                var toastTimer = null;
                function toast(message) {
                    var el = page.querySelector('#QbtToast');
                    el.textContent = message;
                    el.classList.add('is-shown');
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(function () { el.classList.remove('is-shown'); }, 3500);
                }

                // --- stats -------------------------------------------------------------

                function refreshTransfer() {
                    ajax('qbittorrent/transfer').then(function (t) {
                        state.transfer = t;
                        var prefix = t.AlternativeSpeedLimitsEnabled ? 'Alt limit ' : 'Limit ';
                        page.querySelector('#QbtDlValue').textContent = formatSpeed(t.DownloadSpeed);
                        page.querySelector('#QbtUpValue').textContent = formatSpeed(t.UploadSpeed);
                        page.querySelector('#QbtDlLimit').textContent = t.DownloadSpeedLimit > 0 ? prefix + formatSpeed(t.DownloadSpeedLimit) : 'No limit';
                        page.querySelector('#QbtUpLimit').textContent = t.UploadSpeedLimit > 0 ? prefix + formatSpeed(t.UploadSpeedLimit) : 'No limit';
                        page.querySelector('#QbtLimitsButton').classList.toggle('is-active', !!t.AlternativeSpeedLimitsEnabled);
                    }, function () {
                        page.querySelector('#QbtDlValue').textContent = '—';
                        page.querySelector('#QbtUpValue').textContent = '—';
                    });
                }

                function countState(s) {
                    return state.torrents.filter(function (t) { return t.State === s; }).length;
                }

                function renderCounts() {
                    page.querySelector('#QbtDownloadingCount').textContent = countState('Downloading');
                    page.querySelector('#QbtSeedingCount').textContent = countState('Seeding');
                    renderTabs();
                }

                // --- filter tabs --------------------------------------------------------

                function renderTabs() {
                    page.querySelector('#QbtTabs').innerHTML = TABS.map(function (tab) {
                        var count = tab[0] ? countState(tab[0]) : state.torrents.length;
                        return '<button type="button" class="qbt-segment" data-state="' + tab[0] + '" aria-pressed="' + (state.filterState === tab[0]) + '">' +
                            tab[1] + '<span class="num">' + count + '</span></button>';
                    }).join('');
                }

                renderTabs();

                page.querySelector('#QbtTabs').addEventListener('click', function (e) {
                    var button = e.target.closest('button');
                    if (!button) { return; }
                    state.filterState = button.getAttribute('data-state');
                    renderTabs();
                    renderList();
                });

                // --- torrent list --------------------------------------------------------

                function refreshTorrents() {
                    // ponytail: header counts + tab filtering computed client-side from a single
                    // pageSize=200 fetch. Add a real server-side aggregate-counts endpoint if
                    // libraries regularly exceed 200 torrents.
                    var query = 'pageSize=200' + (state.search ? '&search=' + encodeURIComponent(state.search) : '');
                    ajax('qbittorrent/torrents?' + query).then(function (result) {
                        state.torrents = result.Items || [];
                        renderCounts();
                        var detail = page.querySelector('#QbtDetail');
                        if (detail && detail.contains(document.activeElement)) { return; }
                        renderList();
                    }, function () {
                        page.querySelector('#QbtList').innerHTML =
                            '<div class="qbt-empty"><strong>Unable to reach qBittorrent</strong>Check the connection in Settings.</div>';
                    });
                }

                function visibleTorrents() {
                    if (!state.filterState) { return state.torrents; }
                    return state.torrents.filter(function (t) { return t.State === state.filterState; });
                }

                function renderList() {
                    var list = page.querySelector('#QbtList');
                    var visible = visibleTorrents();

                    if (visible.length === 0) {
                        list.innerHTML = state.search || state.filterState
                            ? '<div class="qbt-empty"><strong>No matching torrents</strong>Try a different filter or search.</div>'
                            : '<div class="qbt-empty"><strong>No torrents yet</strong>Add a magnet link or .torrent file to get started.</div>';
                        return;
                    }

                    list.innerHTML = visible.map(renderRow).join('');

                    if (state.openHash && visible.some(function (t) { return t.Hash === state.openHash; })) {
                        renderDetail(state.openHash);
                    }
                }

                function renderRow(t) {
                    var progressPct = Math.round((t.Progress || 0) * 100);
                    var isOpen = state.openHash === t.Hash;
                    var isActive = ACTIVE_STATES.indexOf(t.State) !== -1;
                    var hash = escapeHtml(t.Hash);

                    return '' +
                        '<div class="qbt-row' + (isOpen ? ' is-open' : '') + '" data-hash="' + hash + '" style="--qbt-status:' + stateColor(t.State) + '">' +
                        '  <div class="qbt-row-head" data-row-head role="button" tabindex="0" aria-expanded="' + isOpen + '">' +
                        '    <div style="min-width:0">' +
                        '      <div class="qbt-name" title="' + escapeHtml(t.Name) + '">' + escapeHtml(t.Name) + '</div>' +
                        '      <div class="qbt-meta"><span class="qbt-status">' + escapeHtml(t.State) + '</span><span>·</span>' +
                        '        <span class="num">' + formatBytes(t.Size) + '</span><span>·</span><span>' + escapeHtml(t.Category || 'Uncategorized') + '</span>' +
                        (t.Tags || []).map(function (tag) { return '<span class="qbt-tag">' + escapeHtml(tag) + '</span>'; }).join('') + '</div>' +
                        '    </div>' +
                        '    <div class="qbt-progress"><div class="qbt-bar"><span style="width:' + progressPct + '%"></span></div><span class="num" style="min-width:3ch;text-align:right">' + progressPct + '%</span></div>' +
                        '    <div class="qbt-speeds num"><span>&#8595; ' + formatSpeed(t.DownloadSpeed) + '</span><span class="muted">&#8593; ' + formatSpeed(t.UploadSpeed) + '</span></div>' +
                        '    <div class="qbt-eta num muted">' + (t.State === 'Downloading' ? formatEta(t.Eta) : '—') + '</div>' +
                        '    <button type="button" class="qbt-btn qbt-icon-btn" data-quick="' + (isActive ? 'pause' : 'resume') + '" title="' + (isActive ? 'Pause' : 'Resume') + '" aria-label="' + (isActive ? 'Pause' : 'Resume') + '">' +
                        (isActive ? ICON_PAUSE : ICON_PLAY) + '</button>' +
                        '  </div>' +
                        (isOpen ? '<div id="QbtDetail" class="qbt-detail"></div>' : '') +
                        '</div>';
                }

                function rowHashOf(el) {
                    var row = el.closest('[data-hash]');
                    return row ? row.getAttribute('data-hash') : null;
                }

                page.querySelector('#QbtList').addEventListener('click', function (e) {
                    var quick = e.target.closest('[data-quick]');
                    if (quick) {
                        runAction(rowHashOf(quick), quick.getAttribute('data-quick'));
                        return;
                    }
                    var head = e.target.closest('[data-row-head]');
                    if (head) { toggleDetail(rowHashOf(head)); }
                });

                page.querySelector('#QbtList').addEventListener('keydown', function (e) {
                    if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute('data-row-head')) {
                        e.preventDefault();
                        toggleDetail(rowHashOf(e.target));
                    }
                });

                function toggleDetail(hash) {
                    state.openHash = state.openHash === hash ? null : hash;
                    state.openTab = 'files';
                    renderList();
                }

                // --- actions -----------------------------------------------------------

                function runAction(hash, action) {
                    var request;

                    if (action === 'delete' || action === 'delete-files') {
                        var deleteFiles = action === 'delete-files';
                        var torrent = state.torrents.find(function (t) { return t.Hash === hash; });
                        var name = torrent ? torrent.Name : hash;
                        var message = deleteFiles
                            ? 'Delete torrent and downloaded files?\n\n' + name + '\n\nThis will permanently delete the torrent and its downloaded data.'
                            : 'Delete torrent "' + name + '"? Downloaded files are kept.';

                        if (!window.confirm(message)) { return; }

                        request = apiDelete('qbittorrent/torrents/' + hash + '?deleteFiles=' + deleteFiles);
                    } else {
                        request = apiPost('qbittorrent/torrents/' + hash + '/' + action);
                    }

                    request.then(function () {
                        if (action === 'delete' || action === 'delete-files') { state.openHash = null; }
                        refreshTorrents();
                    }, function () {
                        toast('Action failed. See server logs for details.');
                    });
                }

                function torrentByHash(hash) {
                    return state.torrents.find(function (t) { return t.Hash === hash; });
                }

                var PRIORITIES = [[0, 'Skip'], [1, 'Normal'], [6, 'High'], [7, 'Maximum']];

                function renderDetail(hash) {
                    var container = page.querySelector('#QbtDetail');
                    if (!container) { return; }

                    var tabs = [['files', 'Files'], ['peers', 'Peers'], ['trackers', 'Trackers']];
                    var actions = [
                        ['resume', 'Resume'], ['pause', 'Pause'], ['force-resume', 'Force resume'],
                        ['recheck', 'Recheck'], ['reannounce', 'Reannounce'], null,
                        ['delete', 'Delete', true], ['delete-files', 'Delete with files', true]
                    ];
                    var cacheKey = hash + '/' + state.openTab;

                    container.innerHTML =
                        '<div class="qbt-detail-bar">' +
                        '  <div class="qbt-tabs" role="tablist">' +
                        tabs.map(function (tab) {
                            return '<button type="button" class="qbt-tab" role="tab" data-tab="' + tab[0] + '" aria-selected="' + (state.openTab === tab[0]) + '">' + tab[1] + '</button>';
                        }).join('') +
                        '  </div>' +
                        '  <div class="qbt-actions">' +
                        actions.map(function (a) {
                            if (!a) { return '<span class="qbt-sep"></span>'; }
                            return '<button type="button" class="qbt-btn qbt-btn-sm' + (a[2] ? ' qbt-btn-danger' : '') + '" data-action="' + a[0] + '">' + a[1] + '</button>';
                        }).join('') +
                        '  </div>' +
                        '</div>' +
                        '<form class="qbt-tags-edit" data-tags-form><label class="muted" for="QbtTagsInput">Tags</label>' +
                        '  <input id="QbtTagsInput" class="qbt-input" type="text" placeholder="Comma-separated, e.g. 4k, family" value="' + escapeHtml((torrentByHash(hash) || {}).Tags ? torrentByHash(hash).Tags.join(', ') : '') + '" />' +
                        '  <button type="submit" class="qbt-btn qbt-btn-sm">Save tags</button></form>' +
                        '<div id="QbtDetailBody">' + (state.detailCache[cacheKey] || '<div class="qbt-detail-msg">Loading…</div>') + '</div>';

                    container.querySelector('[data-tags-form]').addEventListener('submit', function (e) {
                        e.preventDefault();
                        var tags = container.querySelector('#QbtTagsInput').value.split(',')
                            .map(function (t) { return t.trim(); }).filter(function (t) { return t; });
                        apiJson('PUT', 'qbittorrent/torrents/' + hash + '/tags', { Tags: tags }).then(function () {
                            toast('Tags saved');
                            document.activeElement.blur();
                            refreshTorrents();
                        }, function () { toast('Could not save tags.'); });
                    });

                    container.querySelector('#QbtDetailBody').addEventListener('change', function (e) {
                        var select = e.target.closest('[data-file]');
                        if (!select) { return; }
                        apiJson('POST', 'qbittorrent/torrents/' + hash + '/files/priority', { Files: [parseInt(select.getAttribute('data-file'), 10)], Priority: parseInt(select.value, 10) })
                            .then(function () { select.blur(); }, function () { toast('Could not change file priority.'); });
                    });

                    container.querySelectorAll('[data-tab]').forEach(function (button) {
                        button.addEventListener('click', function () {
                            state.openTab = button.getAttribute('data-tab');
                            renderDetail(hash);
                        });
                    });

                    container.querySelectorAll('[data-action]').forEach(function (button) {
                        button.addEventListener('click', function () { runAction(hash, button.getAttribute('data-action')); });
                    });

                    var tab = state.openTab;
                    ajax('qbittorrent/torrents/' + hash + '/' + tab).then(function (items) {
                        state.detailCache = {};
                        state.detailCache[cacheKey] = renderDetailTable(tab, items);
                        var body = container.querySelector('#QbtDetailBody');
                        if (body && state.openTab === tab) { body.innerHTML = state.detailCache[cacheKey]; }
                    }, function () {
                        var body = container.querySelector('#QbtDetailBody');
                        if (body) { body.innerHTML = '<div class="qbt-detail-msg">Unable to load.</div>'; }
                    });
                }

                function table(headers, rows) {
                    return '<table class="qbt-table"><thead><tr>' +
                        headers.map(function (h) { return '<th class="' + (h[1] || '') + '" style="' + (h[2] ? 'width:' + h[2] : '') + '">' + h[0] + '</th>'; }).join('') +
                        '</tr></thead><tbody>' +
                        rows.map(function (r) {
                            return '<tr>' + r.map(function (c, i) { return '<td class="' + (headers[i][1] || '') + '"' + (/<select/.test(c) ? '' : ' title="' + c.replace(/<[^>]*>/g, '') + '"') + '>' + c + '</td>'; }).join('') + '</tr>';
                        }).join('') +
                        '</tbody></table>';
                }

                function renderDetailTable(tab, items) {
                    if (!items || items.length === 0) {
                        return '<div class="qbt-detail-msg">Nothing to show.</div>';
                    }

                    if (tab === 'files') {
                        return table([['Name'], ['Size', 'r num', '90px'], ['Progress', 'r num', '80px'], ['Priority', 'r', '110px']], items.map(function (f) {
                            var select = '<select class="qbt-input" data-file="' + f.Index + '" aria-label="Priority">' +
                                PRIORITIES.map(function (p) {
                                    return '<option value="' + p[0] + '"' + (p[0] === f.Priority ? ' selected' : '') + '>' + p[1] + '</option>';
                                }).join('') + '</select>';
                            return [escapeHtml(f.Name), formatBytes(f.Size), Math.round((f.Progress || 0) * 100) + '%', select];
                        }));
                    }

                    if (tab === 'peers') {
                        return table([['Address', 'num'], ['Client', 'hide-sm'], ['Down', 'r num', '100px'], ['Up', 'r num', '100px']], items.map(function (p) {
                            return [escapeHtml(p.Ip) + ':' + p.Port, escapeHtml(p.Client), formatSpeed(p.DownloadSpeed), formatSpeed(p.UploadSpeed)];
                        }));
                    }

                    return table([['URL'], ['Status', '', '110px'], ['Peers', 'r num', '60px']], items.map(function (t) {
                        return [escapeHtml(t.Url), escapeHtml(t.Status), String(t.NumPeers)];
                    }));
                }

                // --- polling & search ----------------------------------------------------

                function refreshAll() { refreshTransfer(); refreshTorrents(); }

                function startPolling() {
                    stopPolling();
                    refreshAll();
                    state.pollHandle = setInterval(refreshAll, REFRESH_MS);
                }

                function stopPolling() {
                    if (state.pollHandle) {
                        clearInterval(state.pollHandle);
                        state.pollHandle = null;
                    }
                }

                page.addEventListener('pageshow', startPolling);
                page.addEventListener('pagehide', stopPolling);

                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        stopPolling();
                    } else if (page.classList.contains('page')) {
                        startPolling();
                    }
                });

                var searchTimer = null;
                page.querySelector('#QbtSearch').addEventListener('input', function (e) {
                    clearTimeout(searchTimer);
                    var value = e.target.value;
                    searchTimer = setTimeout(function () {
                        state.search = value;
                        refreshTorrents();
                    }, 300);
                });

                // --- views ------------------------------------------------------------------

                page.querySelector('.qbt-views').addEventListener('click', function (e) {
                    var button = e.target.closest('[data-view]');
                    if (!button) { return; }
                    var view = button.getAttribute('data-view');
                    page.querySelectorAll('.qbt-views [data-view]').forEach(function (b) {
                        b.setAttribute('aria-selected', String(b === button));
                    });
                    page.querySelector('#QbtTorrentsView').hidden = view !== 'torrents';
                    page.querySelector('#QbtSearchView').hidden = view !== 'search';
                    if (view === 'search') {
                        checkSearchPlugins();
                        page.querySelector('#QbtWebSearchInput').focus();
                    }
                });

                // --- web search (qBittorrent's search engine + its installed plugins) ----------

                var SEARCH_POLL_MS = 1500;
                // ponytail: renders the top results by seeders only; add paging if people scroll past this.
                var SEARCH_MAX_ROWS = 200;
                var webSearch = { id: null, timer: null, results: [], visible: [], running: false };
                var webStatus = page.querySelector('#QbtWebSearchStatus');
                var webResults = page.querySelector('#QbtWebResults');

                function checkSearchPlugins() {
                    ajax('qbittorrent/search/plugins').then(function (plugins) {
                        var enabled = (plugins || []).filter(function (p) { return p.Enabled; }).length;
                        if (enabled === 0 && webSearch.id === null) {
                            webResults.innerHTML = '<div class="qbt-empty"><strong>No search plugins enabled</strong>' +
                                'Install and enable them in qBittorrent under View → Search Engine → Search plugins.</div>';
                        }
                        if (webSearch.id === null) {
                            webStatus.textContent = enabled ? enabled + ' search plugin' + (enabled === 1 ? '' : 's') + ' enabled' : '';
                        }
                    }, function () {
                        webStatus.textContent = 'Unable to reach qBittorrent.';
                    });
                }

                function stopWebSearch() {
                    clearTimeout(webSearch.timer);
                    if (webSearch.id !== null) {
                        apiDelete('qbittorrent/search/' + webSearch.id);
                        webSearch.id = null;
                    }
                }

                function hostOf(url) {
                    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url || ''; }
                }

                function renderWebResults() {
                    var sorted = webSearch.results.slice().sort(function (a, b) { return b.Seeders - a.Seeders; });
                    var count = sorted.length;
                    webStatus.textContent = (webSearch.running ? 'Searching… ' : '') + count + ' result' + (count === 1 ? '' : 's') +
                        (count > SEARCH_MAX_ROWS ? ' (showing top ' + SEARCH_MAX_ROWS + ' by seeders)' : '');

                    if (count === 0) {
                        webResults.innerHTML = webSearch.running
                            ? '<div class="qbt-empty">Searching…</div>'
                            : '<div class="qbt-empty"><strong>No results</strong>Try different keywords.</div>';
                        return;
                    }

                    webResults.innerHTML = sorted.slice(0, SEARCH_MAX_ROWS).map(function (r, i) {
                        var size = r.Size > 0 ? formatBytes(r.Size) : '—';
                        var source = escapeHtml(hostOf(r.SiteUrl));
                        return '' +
                            '<div class="qbt-result qbt-result-grid">' +
                            '  <div style="min-width:0">' +
                            '    <div class="qbt-name" title="' + escapeHtml(r.Name) + '">' + escapeHtml(r.Name) + '</div>' +
                            '    <div class="qbt-meta">' +
                            (/^https?:\/\//.test(r.DescriptionUrl) ? '<a href="' + escapeHtml(r.DescriptionUrl) + '" target="_blank" rel="noopener noreferrer">' + source + ' ↗</a>' : '<span>' + source + '</span>') +
                            '      <span class="show-sm num">· ' + size + ' · <span class="qbt-seeds">' + r.Seeders + ' seeds</span></span>' +
                            '    </div>' +
                            '  </div>' +
                            '  <span class="r num hide-sm">' + size + '</span>' +
                            '  <span class="r num hide-sm qbt-seeds">' + r.Seeders + '</span>' +
                            '  <span class="r num hide-sm muted">' + r.Leechers + '</span>' +
                            '  <button type="button" class="qbt-btn qbt-btn-sm" data-result="' + i + '">Add</button>' +
                            '</div>';
                    }).join('');
                    webSearch.visible = sorted;
                }

                function pollWebSearch(id) {
                    ajax('qbittorrent/search/' + id).then(function (result) {
                        if (webSearch.id !== id) { return; }
                        webSearch.results = result.Results || [];
                        webSearch.running = result.Status === 'Running';
                        renderWebResults();
                        if (webSearch.running) {
                            webSearch.timer = setTimeout(function () { pollWebSearch(id); }, SEARCH_POLL_MS);
                        }
                    }, function () {
                        if (webSearch.id !== id) { return; }
                        webSearch.running = false;
                        webStatus.textContent = 'Search failed. See server logs for details.';
                    });
                }

                page.querySelector('#QbtWebSearchForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var pattern = page.querySelector('#QbtWebSearchInput').value.trim();
                    if (!pattern) { return; }

                    stopWebSearch();
                    webSearch.results = [];
                    webSearch.running = true;
                    renderWebResults();

                    ApiClient.ajax({
                        type: 'POST',
                        url: ApiClient.getUrl('api/qbittorrent/search'),
                        data: JSON.stringify({ Pattern: pattern }),
                        contentType: 'application/json',
                        dataType: 'json'
                    }).then(function (job) {
                        webSearch.id = job.Id;
                        pollWebSearch(job.Id);
                    }, function () {
                        webSearch.running = false;
                        webResults.innerHTML = '<div class="qbt-empty"><strong>Search failed</strong>Check that qBittorrent has search plugins installed and enabled.</div>';
                        webStatus.textContent = '';
                    });
                });

                webResults.addEventListener('click', function (e) {
                    var button = e.target.closest('[data-result]');
                    if (!button) { return; }
                    var result = webSearch.visible[parseInt(button.getAttribute('data-result'), 10)];
                    if (result) { openAddDialog(result.DownloadLink); }
                });

                page.addEventListener('pagehide', stopWebSearch);

                // --- speed limits ----------------------------------------------------------

                var limitsDialog = page.querySelector('#QbtLimitsDialog');

                function syncLimitInputs() {
                    // qBittorrent reports the active limits, so while alternative limits are on the
                    // normal ones aren't known here; editing them then would overwrite them blindly.
                    var alt = page.querySelector('#QbtAltLimits').checked;
                    page.querySelector('#QbtLimitDown').disabled = alt;
                    page.querySelector('#QbtLimitUp').disabled = alt;
                    page.querySelector('#QbtLimitsHint').textContent = alt
                        ? 'Alternative limits are set in qBittorrent. Turn them off to edit the normal limits.'
                        : '0 means unlimited. Leave both blank to keep the current limits.';
                }

                page.querySelector('#QbtLimitsButton').addEventListener('click', function () {
                    var t = state.transfer || {};
                    page.querySelector('#QbtAltLimits').checked = !!t.AlternativeSpeedLimitsEnabled;
                    page.querySelector('#QbtLimitDown').value = t.AlternativeSpeedLimitsEnabled ? '' : Math.round((t.DownloadSpeedLimit || 0) / 1024);
                    page.querySelector('#QbtLimitUp').value = t.AlternativeSpeedLimitsEnabled ? '' : Math.round((t.UploadSpeedLimit || 0) / 1024);
                    page.querySelector('#QbtLimitsError').textContent = '';
                    syncLimitInputs();
                    limitsDialog.showModal();
                });

                page.querySelector('#QbtAltLimits').addEventListener('change', syncLimitInputs);
                page.querySelector('#QbtLimitsCancel').addEventListener('click', function () { limitsDialog.close(); });
                limitsDialog.addEventListener('click', function (e) {
                    if (e.target === limitsDialog) { limitsDialog.close(); }
                });

                page.querySelector('#QbtLimitsForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var wasAlt = !!(state.transfer || {}).AlternativeSpeedLimitsEnabled;
                    var alt = page.querySelector('#QbtAltLimits').checked;
                    var steps = [];

                    if (!alt) {
                        var downText = page.querySelector('#QbtLimitDown').value;
                        var upText = page.querySelector('#QbtLimitUp').value;
                        var down = parseInt(downText || '0', 10);
                        var up = parseInt(upText || '0', 10);
                        if (!(down >= 0) || !(up >= 0)) {
                            page.querySelector('#QbtLimitsError').textContent = 'Limits must be 0 or more.';
                            return;
                        }
                        // Turn alternative limits off first so the new limits apply to the normal ones.
                        if (wasAlt) { steps.push(function () { return apiPost('qbittorrent/transfer/alternative-speed-limits/toggle'); }); }
                        if (downText !== '' || upText !== '') {
                            steps.push(function () { return apiJson('PUT', 'qbittorrent/transfer/limits', { DownloadLimit: down * 1024, UploadLimit: up * 1024 }); });
                        }
                    } else if (!wasAlt) {
                        steps.push(function () { return apiPost('qbittorrent/transfer/alternative-speed-limits/toggle'); });
                    }

                    steps.reduce(function (p, step) { return p.then(step); }, Promise.resolve()).then(function () {
                        limitsDialog.close();
                        toast('Speed limits saved');
                        refreshTransfer();
                    }, function () {
                        page.querySelector('#QbtLimitsError').textContent = 'Could not save speed limits.';
                    });
                });

                // --- add torrent ---------------------------------------------------------

                var addDialog = page.querySelector('#QbtAddDialog');
                var addForm = page.querySelector('#QbtAddForm');
                var addProfileSelect = page.querySelector('#QbtAddProfile');
                var addFileInput = page.querySelector('#QbtAddFile');
                var addFileName = page.querySelector('#QbtAddFileName');
                var profiles = [];

                page.querySelector('#QbtAddButton').addEventListener('click', function () { openAddDialog(''); });

                function openAddDialog(link) {
                    addForm.reset();
                    addFileName.textContent = 'No file selected';
                    page.querySelector('#QbtAddError').textContent = '';
                    ajax('qbittorrent/profiles').then(function (list) {
                        profiles = list || [];
                        addProfileSelect.innerHTML = '<option value="">None — set manually</option>' +
                            profiles.map(function (p, i) { return '<option value="' + i + '">' + escapeHtml(p.Name) + '</option>'; }).join('');
                    });
                    page.querySelector('#QbtAddMagnet').value = link;
                    addDialog.showModal();
                    page.querySelector(link ? '#QbtAddProfile' : '#QbtAddMagnet').focus();
                }

                page.querySelector('#QbtAddCancel').addEventListener('click', function () { addDialog.close(); });

                // Close when clicking the backdrop.
                addDialog.addEventListener('click', function (e) {
                    if (e.target === addDialog) { addDialog.close(); }
                });

                addFileInput.addEventListener('change', function () {
                    var file = addFileInput.files && addFileInput.files[0];
                    addFileName.textContent = file ? file.name : 'No file selected';
                });

                addProfileSelect.addEventListener('change', function () {
                    var profile = profiles[parseInt(addProfileSelect.value, 10)];
                    if (profile) {
                        page.querySelector('#QbtAddCategory').value = profile.Category || '';
                        page.querySelector('#QbtAddSavePath').value = profile.SavePath || '';
                    }
                });

                addForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    var magnet = page.querySelector('#QbtAddMagnet').value.trim();
                    var file = addFileInput.files && addFileInput.files[0];
                    var errorEl = page.querySelector('#QbtAddError');
                    var submit = page.querySelector('#QbtAddSubmit');

                    if (!magnet && !file) {
                        errorEl.textContent = 'Enter a magnet link/URL or choose a .torrent file.';
                        return;
                    }

                    var formData = new FormData();
                    if (file) { formData.append('torrentFile', file); }
                    if (magnet) { formData.append('magnetUri', magnet); }
                    formData.append('category', page.querySelector('#QbtAddCategory').value);
                    formData.append('savePath', page.querySelector('#QbtAddSavePath').value);
                    formData.append('startImmediately', page.querySelector('#QbtAddStart').checked);

                    errorEl.textContent = '';
                    submit.disabled = true;
                    // Plain fetch: ApiClient.ajax url-encodes any non-string body, which empties a FormData.
                    fetch(ApiClient.getUrl('api/qbittorrent/torrents'), {
                        method: 'POST',
                        headers: { Authorization: 'MediaBrowser Token="' + ApiClient.accessToken() + '"' },
                        body: formData
                    }).then(function (response) {
                        if (response.ok) { return null; }
                        return response.text().then(function (text) {
                            try { var problem = JSON.parse(text); text = problem.detail || problem.title || text; } catch (ignored) { }
                            return text || ('HTTP ' + response.status);
                        });
                    }, function () {
                        return 'Unable to reach the Jellyfin server.';
                    }).then(function (error) {
                        submit.disabled = false;
                        if (error) {
                            errorEl.textContent = 'Could not add torrent: ' + error;
                            return;
                        }
                        addDialog.close();
                        toast('Torrent added');
                        refreshTorrents();
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
